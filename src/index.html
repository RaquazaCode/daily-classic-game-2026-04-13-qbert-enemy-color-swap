<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Q*bert Enemy Color Swap</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <h1>Q*bert: Enemy Color Swap</h1>
        <p>Paint all cubes while enemies strip colors on contact.</p>
      </header>
      <section class="hud">
        <div>Score: <span id="score">0</span></div>
        <div>Lives: <span id="lives">3</span></div>
        <div>Painted: <span id="painted">0</span>/<span id="total">0</span></div>
        <div>State: <span id="state">running</span></div>
      </section>
      <canvas id="game" width="960" height="640" aria-label="Q*bert game board"></canvas>
      <section class="help">
        <p>Controls: Arrow Keys move diagonally · P pause · R reset · Enter restart</p>
      </section>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
